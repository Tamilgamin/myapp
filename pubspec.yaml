name: ar_chemistry_lab
description: "AR Chemistry Lab mobile application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  ar_flutter_plugin: ^0.7.3
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  google_mobile_ads: ^5.0.0
  http: ^1.2.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  audioplayers: ^6.0.0
  vibration: ^1.8.4
  path_provider: ^2.1.3
  screenshot: ^3.0.0
  share_plus: ^10.0.0
  flutter_tts: ^4.0.0
  speech_to_text: ^6.3.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/experiments.json
